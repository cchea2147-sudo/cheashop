<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #111827;
        --panel: rgba(17, 24, 39, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --primary: #60a5fa;
        --primary-dark: #2563eb;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --input: rgba(15, 23, 42, 0.75);
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, rgba(96, 165, 250, 0.22), transparent 35%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
      }

      .login-card {
        width: min(92vw, 420px);
        padding: 2.2rem 1.8rem;
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        font-weight: 700;
        color: white;
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
      }

      .subtitle {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      .field {
        display: grid;
        gap: 0.45rem;
      }

      label {
        font-size: 0.86rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: var(--input);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(96, 165, 250, 0.8);
        box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: 0.25rem;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .checkbox input {
        width: auto;
        accent-color: var(--primary);
      }

      .link {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.85rem;
      }

      .link:hover {
        text-decoration: underline;
      }

      .login-btn {
        margin-top: 0.25rem;
        padding: 0.95rem 1rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--muted);
        margin: 0.5rem 0;
        font-size: 0.8rem;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
      }

      .socials {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .social-btn {
        padding: 0.8rem 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.4);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
      }

      .signup {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .signup a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .signup a:hover {
        text-decoration: underline;
      }

      @media (max-width: 420px) {
        .login-card {
          padding: 1.5rem 1.1rem;
        }

        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <div class="brand-mark">L</div>
        <h1>Login</h1>
      </div>

      <p class="subtitle">Welcome back! Please sign in to continue.</p>

      <form>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" />
        </div>

        <div class="row">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>

          <a href="#" class="link">Forgot password?</a>
        </div>

        <button class="login-btn" type="submit">Sign In</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="socials">
        <button class="social-btn" type="button">Google</button>
        <button class="social-btn" type="button">GitHub</button>
      </div>

      <p class="signup">Don't have an account? <a href="#">Create one</a></p>
    </main>
  </body>
</html>
